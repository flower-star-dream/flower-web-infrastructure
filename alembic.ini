# Alembic database migration configuration (compliance S13-1, authoritative change management tool).
# NOTE: This file is parsed by configparser with the locale encoding on Windows (GBK),
# so keep all comments ASCII-only. Author/date/description metadata lives in alembic/env.py.
[alembic]
# Directory of migration scripts (relative to project root).
script_location = alembic
# Add the project root to sys.path (env.py also appends src/ so web_infra is importable).
prepend_sys_path = .
# Database URL: left empty; injected by alembic/env.py (env var DATABASE_URL wins over this key).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
