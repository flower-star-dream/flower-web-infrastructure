# =====================================================================
# flower-web-infrastructure PyPI 发布（Trusted Publisher / OIDC）
# @Author: 花海
# @Date: 2026/08/18 10:00
# @Description: 发布 Python 包到 PyPI，先 TestPyPI 验证、正式 PyPI 手动触发：
#               - v* 版本 tag 推送时自动构建并发布到 TestPyPI（与 release 流程衔接：
#                 发版合入 main 后自动打 vX.Y.Z tag，随即自动验证包内容与安装）；
#               - workflow_dispatch 手动选择 target（testpypi / pypi）发布，
#                 TestPyPI 验证通过后选 pypi 发布正式版。
#               凭据：Trusted Publisher（OIDC），无长期 token。须在 TestPyPI / PyPI
#               平台侧分别为本工作流（workflow.yml）添加信任绑定，绑定信息：
#               GitHub 仓库 + 工作流 workflow.yml + environment（testpypi / pypi）。
# =====================================================================
name: publish-to-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标（TestPyPI 验证通过后选择 pypi 发布正式版）"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: 构建 sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建发行包（sdist + wheel）
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: 上传发行包
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: 发布到 TestPyPI（OIDC）
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # Trusted Publisher：向 TestPyPI 换取短期发布凭据
    # v* tag 推送自动验证；手动触发且选择 testpypi 时也可手动发布
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    steps:
      - name: 下载发行包
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: 发布到 PyPI（OIDC）
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publisher：向 PyPI 换取短期发布凭据
    # 正式版仅手动触发（TestPyPI 验证通过后选择 pypi），可配合 pypi 环境保护规则加人工审批
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    steps:
      - name: 下载发行包
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
