# =====================================================================
# flower-web-infrastructure CI/CD（GitHub Actions）
# @Author: 花海
# @Date: 2026/08/16 10:00
# @Description: 推送 main / 版本 tag / PR 时执行：静态类型检查（pyright，容忍既有基线）、
#               单元测试（pytest 硬性门禁）、Docker 基础镜像构建、镜像签名
#               （整改 S20-4：cosign keyless（OIDC）签名，基于 GitHub Actions OIDC 身份，
#               无需配置任何密钥；部署侧必须配套 cosign verify 校验后再拉取镜像）。
#               镜像推送（GHCR）：push main 推测试标签 <分支名>-<时间戳>-<构建号> 并更新 latest
#               （脚手架等下游 CI 拉取 latest 作为基础镜像）；版本 tag v* 推 SemVer + latest；
#               PR 只构建/扫描/冒烟，不推送（详见 docs/CI-CD.md）。
# =====================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（dev + mysql/redis/mongo 运行库）
        run: pip install -e ".[dev,mysql,redis,mongo]"

      - name: 静态类型检查（pyright）
        # 既有基线 16 个类型错误暂不阻塞（continue-on-error），新增代码由本地 pyright 门禁保证
        continue-on-error: true
        run: pyright

      - name: 单元测试（pytest + 覆盖率门禁）
        # 整改 S11-2：行覆盖率硬性门禁 >=70%（阈值与 coverage 配置见 pyproject.toml [tool.coverage]）；
        # 2026-08-15 整改后实测行覆盖率 85.5%、分支覆盖率 82.8%；分支门禁暂未启用（渐进目标 fail_under=60）
        run: pytest -q --cov=web_infra --cov-fail-under=70

  build-image:
    name: 构建 Docker 基础镜像
    runs-on: ubuntu-latest
    needs: test
    # GHCR 推送 + cosign keyless 签名所需权限：packages: write 推送镜像，id-token: write 提供 OIDC 身份
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建基础镜像
        # 整改 S20-3：:ci 仅为 CI 内部构建标签（不对外推送）；镜像推送标签规范见 docs/CI-CD.md：
        # 测试版 <分支名>-<时间戳>-<构建号>、正式版 SemVer、latest 跟随最新 main 构建（正式版发布时覆盖为正式版）
        run: docker build -t flower-web-infrastructure:ci .

      - name: 镜像漏洞扫描（Trivy，高危/严重阻断上线）
        # 规范 §20.2：镜像必须扫描，高危漏洞阻断构建产物留存
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flower-web-infrastructure:ci
          format: table
          exit-code: "1"          # 存在高危/严重漏洞即失败（阻断）
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 忽略无修复版本的漏洞，避免无解阻断

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      - name: 镜像签名（cosign keyless，OIDC）
        # 整改 S20-4（规范 §20.4 镜像签名校验）：
        # 1) Keyless（OIDC）签名：cosign v2 默认 keyless，使用 GitHub Actions 的 OIDC 身份
        #    （本 Job 已声明 permissions: id-token: write），无需配置任何密钥/Secret；
        #    签名绑定镜像 digest，推送时重打 tag（main-xxx / SemVer / latest）不影响签名有效性。
        # 2) 部署侧必须配套 cosign verify 校验签名后才拉取镜像（供应链防篡改），校验示例：
        #    cosign verify \
        #      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #      --certificate-identity-regexp \
        #        "https://github.com/flower-star-dream/flower-web-infrastructure/.github/workflows/ci.yml@refs/.*" \
        #      ghcr.io/flower-star-dream/flower-web-infrastructure:<版本>
        run: |
          cosign sign --yes flower-web-infrastructure:ci

      - name: 镜像冒烟验证（/health/live 存活可达）
        # 整改 S19-1：存活冒烟用 /health/live（进程存活，不依赖组件 DOWN 状态）；
        # 就绪探测 /health/ready 由编排层（K8s readinessProbe）使用
        run: |
          docker run -d --name web-infra-smoke -p 18000:8000 flower-web-infrastructure:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/health/live > /dev/null 2>&1; then
              echo "health check passed"; exit 0
            fi
            sleep 1
          done
          docker logs web-infra-smoke || true
          echo "health check failed" >&2
          exit 1

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像（main 分支：测试标签 + latest）
        # 整改 S20-3 标签规范：测试版 <分支名>-<时间戳>-<构建号>（如 main-20260816103000-42）；
        # latest 跟随最新 main 构建——脚手架等下游 CI 拉取 ghcr.io/flower-star-dream/flower-web-infrastructure:latest
        # 作为业务镜像基础（见脚手架 ci.yml / docs/CI-CD.md），正式版 tag 时仍会覆盖为最新正式版
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag flower-web-infrastructure:ci $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker push $IMAGE:main-$(date +%Y%m%d%H%M%S)-${{ github.run_number }}
          docker tag flower-web-infrastructure:ci $IMAGE:latest
          docker push $IMAGE:latest

      - name: 推送镜像（版本 tag v*：SemVer + latest）
        # 正式版：语义化版本（SemVer，与 pyproject.toml 版本号保持一致），同时更新 latest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag flower-web-infrastructure:ci $IMAGE:$VERSION
          docker push $IMAGE:$VERSION
          docker tag flower-web-infrastructure:ci $IMAGE:latest
          docker push $IMAGE:latest
