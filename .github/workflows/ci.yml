# =====================================================================
# flower-web-infrastructure CI/CD（GitHub Actions）
# @Author: 花海
# @Date: 2026/08/16 10:00
# @Description: 推送 main / dev / 版本 tag / PR 时执行：静态类型检查（pyright，容忍既有基线）、
#               单元测试（pytest 硬性门禁）、Docker 基础镜像构建、镜像签名
#               （整改 S20-4：cosign keyless（OIDC）签名，基于 GitHub Actions OIDC 身份，
#               无需配置任何密钥；部署侧必须配套 cosign verify 校验后再拉取镜像）。
#               main / dev 分支推送即执行完整验证并推送测试标签
#               <分支名>-<时间戳>-<构建号>（如 main-202608161030-42 / dev-202608161030-7）；
#               main 分支额外打 v<pyproject版本> 标签（如 v1.0.0，与正式版共用、滚动覆盖）；
#               版本 tag v* 推 v<SemVer> + latest
#               （latest 仅随正式版更新，规范 §20.1.1）；PR 只构建/扫描/冒烟，不推送（详见 docs/CI-CD.md）。
# =====================================================================
name: CI

on:
  push:
    branches: [main, dev]  # main/dev 分支推送即完整验证并推送测试标签；PR 提交前先跑通 CI
    tags: ["v*"]          # 版本 tag 无条件触发：发布正式版镜像，不受 paths-ignore 影响
    paths-ignore:         # 仅文档/非代码变更不触发（不参与单元测试与镜像构建）
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "db/**"
      - "data/**"

jobs:
  test:
    name: 静态检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（dev + mysql/redis/mongo/es 运行库）
        # es extra：Elasticsearch 搜索引擎与向量检索测试依赖（elasticsearch-dsl，延迟导入）
        run: pip install -e ".[dev,mysql,redis,mongo,es]"

      - name: 静态类型检查（pyright）
        # 既有基线 16 个类型错误暂不阻塞（continue-on-error），新增代码由本地 pyright 门禁保证
        continue-on-error: true
        run: pyright

      - name: 单元测试（pytest + 覆盖率门禁）
        # 整改 S11-2：行覆盖率硬性门禁 >=70%（阈值与 coverage 配置见 pyproject.toml [tool.coverage]）；
        # 2026-08-15 整改后实测行覆盖率 85.5%、分支覆盖率 82.8%；分支门禁暂未启用（渐进目标 fail_under=60）
        run: pytest -q --cov=web_infra --cov-fail-under=70

  build-image:
    name: 构建 Docker 基础镜像
    runs-on: ubuntu-latest
    needs: test
    # GHCR 推送 + cosign keyless 签名所需权限：packages: write 推送镜像，id-token: write 提供 OIDC 身份
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建基础镜像
        # 整改 S20-3：:ci 仅为 CI 内部构建标签（不对外推送）；镜像推送标签规范见 docs/CI-CD.md：
        # 测试版 <分支名>-<时间戳>-<构建号>（main 额外打 v<pyproject版本>）、正式版 v<SemVer>、latest 仅随正式版更新
        run: docker build -t flower-web-infrastructure:ci .

      - name: 镜像漏洞扫描（Trivy，高危/严重阻断上线）
        # 规范 §20.2：镜像必须扫描，高危漏洞阻断构建产物留存
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flower-web-infrastructure:ci
          format: table
          exit-code: "1"          # 存在高危/严重漏洞即失败（阻断）
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 忽略无修复版本的漏洞，避免无解阻断

      - name: 安装 cosign
        uses: sigstore/cosign-installer@v3

      - name: 镜像冒烟验证（/health/live 存活可达）
        # 整改 S19-1：存活冒烟用 /health/live（进程存活，不依赖组件 DOWN 状态）；
        # 就绪探测 /health/ready 由编排层（K8s readinessProbe）使用
        run: |
          docker run -d --name web-infra-smoke -p 18000:8000 flower-web-infrastructure:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/health/live > /dev/null 2>&1; then
              echo "health check passed"; exit 0
            fi
            sleep 1
          done
          docker logs web-infra-smoke || true
          echo "health check failed" >&2
          exit 1

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像 + 签名（main/dev 分支：测试标签）
        # 整改 S20-3 标签规范：测试版 <分支名>-<时间戳>-<构建号>（如 main-202608161030-42 / dev-202608161030-7）；
        # 分支名取自 github.ref_name（当前分支），分支命名需规避 "/"（规范 §20.1.1：/ 转 -）；
        # latest 仅随正式版 tag 更新（规范 §20.1.1），main/dev 测试构建均不推送 latest；
        # 下游（脚手架等）固定以 SemVer/digest 拉取基础镜像（见脚手架 ci.yml / docs/CI-CD.md）。
        # main 分支额外打 v<pyproject版本> 标签（如 v1.0.0，规范 §20.1.1 正式版示例 v1.2.3 的 v 前缀形式），
        # 便于按版本号引用 main 最新构建；该标签与正式版 git tag 共用（main 构建滚动更新，正式版发布时覆盖为正式内容），
        # 生产部署须固定 digest 拉取（规范 §20.2）。
        # 整改 S20-4 镜像签名（keyless/OIDC）：cosign 只能对已推送的仓库镜像签名——本地 :ci 标签无仓库前缀
        # 会被解析到 Docker Hub 导致 401（此前报错），故先推送再签名；签名绑定镜像 digest。
        # 部署侧必须配套 cosign verify 校验（示例见 docs/CI-CD.md §8）。
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          TAG=${{ github.ref_name }}-$(date +%Y%m%d%H%M)-${{ github.run_number }}
          docker tag flower-web-infrastructure:ci $IMAGE:$TAG
          docker push $IMAGE:$TAG
          cosign sign --yes $IMAGE:$TAG
          # main 分支额外打 v<pyproject版本> 标签（dev 分支不打，避免 dev 构建与 main 互相覆盖 v 标签）
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
            docker tag flower-web-infrastructure:ci $IMAGE:v$VERSION
            docker push $IMAGE:v$VERSION
            cosign sign --yes $IMAGE:v$VERSION
          fi

      - name: 推送镜像 + 签名（版本 tag v*：SemVer + latest）
        # 正式版：语义化版本（带 v 前缀，规范 §20.1.1 示例 v1.2.3，与 git tag 同名如 v1.0.0），同时更新 latest；
        # v<版本> 标签与 main 分支构建共用同一标签：main 构建滚动更新，正式版发布时覆盖为正式内容（滚动版本标签，
        # 生产部署须固定 digest 拉取，规范 §20.2）；
        # 先推送后 keyless（OIDC）签名（同分支推送，cosign 不能签名未推送的本地镜像）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          VERSION=${GITHUB_REF#refs/tags/}   # 保留 v 前缀：refs/tags/v1.0.0 → v1.0.0
          docker tag flower-web-infrastructure:ci $IMAGE:$VERSION
          docker push $IMAGE:$VERSION
          docker tag flower-web-infrastructure:ci $IMAGE:latest
          docker push $IMAGE:latest
          cosign sign --yes $IMAGE:$VERSION
          cosign sign --yes $IMAGE:latest
