# =====================================================================
# flower-web-infrastructure 自动发版（PR 合入后生成正式版本）
# @Author: 花海
# @Date: 2026/08/17 22:00
# @Description: dev→main 的 PR 合并成功后，在 main 分支自动生成正式版本号
#               （剥离 .devN 测试后缀并按 PR 标题前缀递增），同步更新
#               pyproject.toml / __init__.py / README / docs 版本引用并推送 main。
#               仅更新版本号，不打 tag（正式镜像发布仍由手动 v* tag 触发，见 ci.yml）。
# =====================================================================
name: release

on:
  pull_request:
    types: [closed]

jobs:
  auto-release:
    name: dev→main 合入后自动发版
    # 仅 dev→main 且合并成功的 PR 触发（普通 close 或非 dev 源分支不触发）
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推送版本号变更到 main 分支
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 自动生成正式版本并推送 main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/release_after_merge.py --pr-title "$PR_TITLE"
